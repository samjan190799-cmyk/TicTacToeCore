name: TicTacToe
options:
  bundleIdPrefix: com.samvel.tictactoe
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  TicTacToe:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: App
    info:
      path: App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.tictactoe
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
